<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spellbound 单词冒险 · 四级版</title>
<style>
:root{--purple:#7a6396;--purple-dark:#5d4a75;--bg:#f7f0e6;--card:#fff;--text:#4a4035;--green:#8fbc8f;--red:#cd5c5c;--gold:#d4a373}
*{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
body{background:var(--bg);padding-bottom:60px;background-image:radial-gradient(#d4c5b3 1px,transparent 1px);background-size:20px 20px}
.topbar{background:var(--purple);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;color:#fff;position:sticky;top:0;z-index:100;border-bottom:4px solid var(--purple-dark)}
.topbar span{color:#fff;font-weight:bold}
.deco{position:fixed;pointer-events:none;opacity:.12;font-size:80px;z-index:0}
.deco.tl{top:60px;left:10px}.deco.tr{top:60px;right:10px}.deco.bl{bottom:80px;left:10px}.deco.br{bottom:80px;right:10px}
.page{display:none;padding:12px;position:relative;z-index:1}
.page.active{display:block}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 12px rgba(122,99,150,.08);border:2px solid #e8dcc8;position:relative}
.btn{background:var(--purple);color:#fff;border:none;padding:12px 16px;border-radius:12px;font-size:15px;cursor:pointer;width:100%;margin:6px 0;font-weight:bold}
.btn:active{transform:scale(.98)}
.btn-alt{background:#e8dcc8;color:var(--text)}
.opt{background:#faf6f0;border:2px solid #e8dcc8;padding:14px;border-radius:12px;margin:6px 0;cursor:pointer;font-size:16px;text-align:center;transition:.2s}
.opt:active{transform:scale(.97)}
.opt.correct{background:#d4edda;border-color:var(--green);color:#155724}
.opt.wrong{background:#f8d7da;border-color:var(--red);color:#721c24}
.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sentence-blank{font-size:18px;line-height:2;margin:12px 0;padding:12px;background:#faf6f0;border-radius:12px;border-left:4px solid var(--purple)}
.sentence-blank .blank{display:inline-block;min-width:90px;border-bottom:3px dashed var(--purple);color:var(--purple);font-weight:bold;text-align:center;padding:0 6px}
.story-bar{background:linear-gradient(135deg,#5d4a75,#7a6396);color:#fff;padding:16px;border-radius:16px;margin-bottom:12px;text-align:center;position:relative;overflow:hidden}
.story-bar::before{content:"🌲";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:32px;opacity:.3}
.story-bar::after{content:"🍄";position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:32px;opacity:.3}
.story-text{color:#fff;font-size:14px;margin-top:8px;background:rgba(255,255,255,.15);padding:8px;border-radius:8px}
.lvl-btn{display:block;width:100%;padding:14px;margin:8px 0;background:#fff;border:2px solid #e8dcc8;border-radius:12px;cursor:pointer;text-align:left;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.lvl-btn:active{background:#faf6f0}
.lvl-btn.cleared{border-color:var(--green);background:#f0f7f0}
.lvl-btn.locked{opacity:.4;pointer-events:none;background:#f0f0f0}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #e8dcc8;display:flex;justify-content:space-around;padding:8px;z-index:100}
.nav div{flex:1;text-align:center;padding:6px;cursor:pointer;font-size:12px}
.nav .active{color:var(--purple);font-weight:bold}
.heart{color:var(--red);font-size:18px}
.coin{background:var(--gold);color:#fff;padding:2px 8px;border-radius:10px;font-size:12px}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal.active{display:flex}
.modal-card{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:360px;text-align:center}
.spell-prefix{font-size:26px;font-weight:bold;color:var(--purple);letter-spacing:2px}
.spell-box{display:inline-block;width:34px;height:38px;border:2px dashed #999;margin:2px;text-align:center;line-height:34px;font-size:19px;font-weight:bold;border-radius:6px;vertical-align:middle}
.spell-box.filled{background:#d4edda;border-color:var(--green)}
.spell-box.wrong{background:#f8d7da;border-color:var(--red)}
.letter-btn{display:inline-block;width:34px;height:34px;line-height:30px;text-align:center;border:2px solid #e8dcc8;border-radius:8px;margin:3px;cursor:pointer;font-weight:bold;background:#faf6f0;font-size:15px}
.letter-btn:active{background:#e8dcc8}
.letter-btn.used{opacity:.3;pointer-events:none}
.music-btn{position:fixed;top:14px;right:60px;z-index:101;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px;color:#fff}
.music-btn.playing{background:rgba(255,255,255,.4)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;z-index:400;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.chapter-nav{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.chapter-nav .cnav{flex:1;min-width:90px;padding:8px;text-align:center;background:#e8dcc8;border-radius:10px;cursor:pointer;font-size:13px}
.chapter-nav .cnav.active{background:var(--purple);color:#fff}
</style>
</head>
<body>

<button class="music-btn" id="musicBtn">🎵</button>
<div class="toast" id="toast"></div>
<div class="deco tl">🌲</div><div class="deco tr">🌿</div><div class="deco bl">🍄</div><div class="deco br">🦌</div>

<div class="topbar" id="topbar">
  <span id="top-title">🗺️ 地图</span>
  <span><span class="heart">♥</span><span id="hp">3</span> &nbsp; <span class="coin">🪙 <span id="coins">0</span></span></span>
</div>

<!-- 地图 -->
<div class="page active" id="map">
  <div class="story-bar">
    <div style="font-size:20px" id="map-chapter-title">📖 第1章：迷雾森林</div>
    <div class="story-text" id="map-story">勇者踏入森林，前方充满未知单词...（三个板块共享进度）</div>
  </div>
  <div class="card">
    <div style="font-weight:bold;margin-bottom:8px">① 选择章节（共 <span id="total-chapters">0</span> 章）</div>
    <div class="chapter-nav" id="chapter-nav"></div>
  </div>
  <div class="card">
    <div style="font-weight:bold;margin-bottom:8px">② 选择课时（已解锁到第 <span id="unlock-info" style="color:var(--purple)">1</span> 课）</div>
    <div id="map-modules"></div>
  </div>
</div>

<!-- 故事 -->
<div class="page" id="story">
  <div class="story-bar">
    <div style="font-size:18px" id="story-title">剧情</div>
    <div class="story-text" id="story-text">...</div>
  </div>
  <div style="text-align:center;margin-top:20px">
    <button class="btn" onclick="startQuiz()">▶ 开始挑战</button>
    <button class="btn btn-alt" onclick="switchPage('map')">返回地图</button>
  </div>
</div>

<!-- 答题 -->
<div class="page" id="quiz">
  <div class="card">
    <div id="quiz-header" style="font-weight:bold;margin-bottom:8px"></div>
    <div id="quiz-area"></div>
    <div style="text-align:center;margin-top:10px"><button class="btn-alt" style="padding:8px 16px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer" onclick="showDetail(state.quizWords[state.currentQ])">📖 查看单词详情</button></div>
  </div>
</div>

<!-- 结果 -->
<div class="page" id="result">
  <div class="card" style="text-align:center;padding:30px">
    <div id="result-stars" style="font-size:40px;margin:10px 0">★★★</div>
    <div id="result-title" style="font-size:22px;font-weight:bold"></div>
    <div id="result-desc" style="margin:10px 0;color:#666"></div>
    <button class="btn" onclick="backToMap()">返回地图</button>
    <button class="btn btn-alt" onclick="retryLevel()">再玩一次</button>
  </div>
</div>

<!-- 单词 -->
<div class="page" id="words">
  <div class="card">
    <div style="margin-bottom:8px">
      <button class="opt active" style="padding:6px;font-size:13px;display:inline-block;width:auto;margin:2px" onclick="filterWords('all',this)">全部</button>
      <button class="opt" style="padding:6px;font-size:13px;display:inline-block;width:auto;margin:2px" onclick="filterWords('mastered',this)">已掌握</button>
      <button class="opt" style="padding:6px;font-size:13px;display:inline-block;width:auto;margin:2px" onclick="filterWords('review',this)">需复习</button>
      <button class="opt" style="padding:6px;font-size:13px;display:inline-block;width:auto;margin:2px" onclick="filterWords('learning',this)">学习中</button>
    </div>
    <div id="word-list"></div>
  </div>
</div>

<!-- 我的 -->
<div class="page" id="me">
  <div class="card" style="text-align:center">
    <div style="font-size:40px">🦊</div>
    <div>已掌握：<b id="me-mastered">0</b> / <span id="me-total">0</span> 词</div>
    <div>金币：🪙 <b id="me-coins">0</b></div>
    <div>学习进度：第 <b id="me-lesson">1</b> 课（全局）</div>
    <div style="margin-top:10px"><b>需复习：</b><div id="review-list"></div></div>
    <button class="btn btn-alt" style="margin-top:10px" onclick="if(confirm('确定清空所有进度？')){localStorage.clear();location.reload()}">清空存档</button>
  </div>
</div>

<!-- 模态 -->
<div class="modal" id="word-modal">
  <div class="modal-card">
    <div id="modal-art" style="font-size:48px">🦌</div>
    <div id="modal-word" style="font-size:24px;font-weight:bold;color:var(--purple)"></div>
    <div id="modal-phon" style="color:#888"></div>
    <div id="modal-pos" style="font-size:13px"></div>
    <div id="modal-meaning" style="margin:8px 0"></div>
    <div id="modal-example" style="font-size:13px;color:#555;background:#faf6f0;padding:8px;border-radius:8px;margin:8px 0"></div>
    <button class="btn" onclick="playModalWord()">🔊 发音</button>
    <button class="btn btn-alt" onclick="closeModal()">关闭</button>
  </div>
</div>

<div class="nav">
  <div id="nav-map" class="active" onclick="switchPage('map')">🗺️<br>地图</div>
  <div id="nav-words" onclick="switchPage('words')">📖<br>单词</div>
  <div id="nav-me" onclick="switchPage('me')">👤<br>我的</div>
</div>

<script>
var WORDS=[
{ch:1,word:"discover",phon:"/dɪˈskʌvər/",pos:"v.",meaning:"发现，揭露",sentence:"We need to ______ a new path through the forest.",translation:"我们需要在森林里______一条新路。",options:["discover","deliver","decorate","destroy"],art:"🔍"},
{ch:1,word:"deliver",phon:"/dɪˈlɪvər/",pos:"v.",meaning:"递送，发表",sentence:"The postman will ______ the letter tomorrow.",translation:"邮递员明天会______这封信。",options:["deliver","discover","develop","delete"],art:"📦"},
{ch:1,word:"decorate",phon:"/ˈdekəreɪt/",pos:"v.",meaning:"装饰",sentence:"We will ______ the room with flowers.",translation:"我们会用花来______房间。",options:["decorate","discover","damage","deliver"],art:"🎀"},
{ch:1,word:"destroy",phon:"/dɪˈstrɔɪ/",pos:"v.",meaning:"破坏，摧毁",sentence:"Don't ______ the old bridge, it is historic.",translation:"不要______那座古桥，它有历史价值。",options:["destroy","discover","deliver","design"],art:"💥"},
{ch:1,word:"frightened",phon:"/ˈfraɪtnd/",pos:"adj.",meaning:"害怕的，受惊的",sentence:"The little deer was ______ by the loud noise.",translation:"小鹿被巨大的声响______了。",options:["frightened","friendly","free","fresh"],art:"🦌"},
{ch:1,word:"friendly",phon:"/ˈfrendli/",pos:"adj.",meaning:"友好的",sentence:"Our new neighbor is very ______.",translation:"我们的新邻居非常______。",options:["friendly","frightened","formal","free"],art:"🤝"},
{ch:1,word:"freeze",phon:"/friːz/",pos:"v.",meaning:"冻结，结冰",sentence:"Water will ______ when it is cold enough.",translation:"天够冷时水会______。",options:["freeze","frighten","flow","fly"],art:"❄️"},
{ch:1,word:"forest",phon:"/ˈfɒrɪst/",pos:"n.",meaning:"森林",sentence:"Many animals live in this ______.",translation:"许多动物住在这片______里。",options:["forest","field","floor","fort"],art:"🌲"},
{ch:1,word:"brave",phon:"/breɪv/",pos:"adj.",meaning:"勇敢的",sentence:"The ______ hero saved the village.",translation:"那位______的英雄拯救了村庄。",options:["brave","bright","brief","broad"],art:"⚔️"},

{ch:1,word:"hidden",phon:"/ˈhɪdn/",pos:"adj.",meaning:"隐藏的",sentence:"We found a ______ treasure in the cave.",translation:"我们在洞里找到了______的宝藏。",options:["hidden","hard","heavy","high"],art:"👁️"},
{ch:1,word:"path",phon:"/pɑːθ/",pos:"n.",meaning:"小路，路径",sentence:"Follow this ______ to the village.",translation:"沿着这条______走到村子。",options:["path","pass","past","park"],art:"🛤️"},
{ch:1,word:"gate",phon:"/ɡeɪt/",pos:"n.",meaning:"大门",sentence:"Please close the ______ after you enter.",translation:"进来后请关上______。",options:["gate","game","garden","gift"],art:"🚪"},
{ch:1,word:"venture",phon:"/ˈventʃər/",pos:"v.",meaning:"冒险，大胆前往",sentence:"We will ______ into the deep forest.",translation:"我们要______深入森林。",options:["venture","visit","voice","view"],art:"🗡️"},

{ch:1,word:"light",phon:"/laɪt/",pos:"n./adj.",meaning:"光；轻的",sentence:"The ______ in the cave is very weak.",translation:"洞里的______非常微弱。",options:["light","list","line","life"],art:"💡"},
{ch:1,word:"creature",phon:"/ˈkriːtʃər/",pos:"n.",meaning:"生物，动物",sentence:"A small ______ ran across the path.",translation:"一个小______跑过了小路。",options:["creature","create","credit","culture"],art:"🐾"},

{ch:1,word:"ancient",phon:"/ˈeɪnʃənt/",pos:"adj.",meaning:"古老的，古代的",sentence:"This is an ______ tree, over 500 years old.",translation:"这是一棵______树，已有500多年。",options:["ancient","angry","anxious","absent"],art:"🏛️"},
{ch:1,word:"mist",phon:"/mɪst/",pos:"n.",meaning:"薄雾",sentence:"A thick ______ covered the whole forest.",translation:"浓______笼罩了整片森林。",options:["mist","miss","most","must"],art:"🌫️"},
{ch:1,word:"trap",phon:"/træp/",pos:"n./v.",meaning:"陷阱；困住",sentence:"The hunter set a ______ for the wolf.",translation:"猎人为狼设了一个______。",options:["trap","trip","true","try"],art:"🕳️"},

var STORY_B=["森林深处，古老符文闪烁...","拼写魔法需要补全每一个字母","月光下，单词显现出真实形态","最终咒语即将完成","符文之力指引着前行的方向","字母汇聚成词，魔法逐渐苏醒","新的篇章，新的魔法等待掌握"];

var LESSONS_PER_CHAPTER=3, WORDS_PER_LESSON=10;

var state={
  hp:3, coins:0,
  currentLevel:1, currentModule:"A", currentChapter:1,
  quizWords:[], currentQ:0, score:0, reviewList:[],
  cleared:{}, lessonProgress:1, mastery:{}, wordStatus:{},
  _lastModule:"A"
};

function loadState(){try{var s=JSON.parse(localStorage.getItem("spellbound_v6"));if(s){
  state.hp=s.hp??3; state.coins=s.coins??0;
  state.cleared=s.cleared||{};
  state.lessonProgress=Math.max(s.lessonProgress||1,1);
  state.mastery=s.mastery||{}; state.reviewList=s.reviewList||[]; state.wordStatus=s.wordStatus||{};
  state._lastModule=s._lastModule||"A"; state.currentChapter=s.currentChapter||1;
}}catch(e){}}
function saveState(){localStorage.setItem("spellbound_v6",JSON.stringify(state))}

function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},1600)}

function switchPage(p){
  document.querySelectorAll(".page").forEach(function(x){x.classList.remove("active")});
  document.getElementById(p).classList.add("active");
  document.getElementById("top-title").textContent=({"map":"🗺️ 地图","story":"📜 剧情","quiz":"⚔️ 挑战","result":"🏆 结果","words":"📖 单词","me":"👤 我的"})[p];
  document.querySelectorAll(".nav div").forEach(function(x){x.classList.remove("active")});
  var nav=({"map":"nav-map","words":"nav-words","me":"nav-me"})[p];
  if(nav)document.getElementById(nav).classList.add("active");
  if(p==="map")renderMap();
  if(p==="words")renderWordList("all");
  if(p==="me")renderMe();
}

function globalLesson(ch,lv){return (ch-1)*LESSONS_PER_CHAPTER+lv}
function chapterOfLesson(gl){return Math.floor((gl-1)/LESSONS_PER_CHAPTER)+1}
function lessonInChapterOf(gl){return ((gl-1)%LESSONS_PER_CHAPTER)+1}
function getLessonWords(gl){var start=(gl-1)*WORDS_PER_LESSON;return WORDS.slice(start,start+WORDS_PER_LESSON)}

function renderMap(){
  var totalCh=Math.ceil(WORDS.length/(LESSONS_PER_CHAPTER*WORDS_PER_LESSON));
  document.getElementById("total-chapters").textContent=totalCh;
  document.getElementById("unlock-info").textContent=state.lessonProgress;
  document.getElementById("hp").textContent=state.hp;
  document.getElementById("coins").textContent=state.coins;
  document.getElementById("map-chapter-title").textContent="📖 "+CHAPTERS[state.currentChapter-1];

  var cnav=document.getElementById("chapter-nav"); cnav.innerHTML="";
  for(var c=1;c<=totalCh;c++){
    var cc=document.createElement("div"); cc.className="cnav"+(c===state.currentChapter?" active":"");
    cc.textContent=CHAPTERS[c-1].split("：")[0];
    (function(ch){cc.onclick=function(){state.currentChapter=ch;renderMap();saveState()}})(c);
    cnav.appendChild(cc);
  }

  var m=document.getElementById("map-modules"); m.innerHTML="";
  var totalLessons=totalCh*LESSONS_PER_CHAPTER;
  var mods=[{id:"A",n:"📝 选词填空"},{id:"B",n:"✏️ 拼写补全"},{id:"C",n:"🧠 释义匹配"}];

  mods.forEach(function(mod){
    var block=document.createElement("div"); block.style.margin="10px 0";
    var clearedCount=0;
    for(var i=1;i<=totalLessons;i++){if(state.cleared[mod.id+"_"+i])clearedCount++}
    block.innerHTML='<div style="font-weight:bold;margin-bottom:4px;color:var(--purple)">'+mod.n+' <span style="font-size:12px;color:#888">（已通关 '+clearedCount+'/'+totalLessons+' 课）</span></div>';
    for(var i=1;i<=LESSONS_PER_CHAPTER;i++){
      var gl=globalLesson(state.currentChapter,i);
      var lvl=document.createElement("div");
      var stars=state.cleared[mod.id+"_"+gl]||0;
      var starStr="★".repeat(stars)+"☆".repeat(3-stars);
      var locked=gl>state.lessonProgress;
      lvl.className="lvl-btn"+(stars>0?" cleared":"")+(locked?" locked":"");
      lvl.innerHTML='第'+state.currentChapter+'章 · 第'+i+'课时 '+(locked?'🔒 ':'')+'<span style="float:right">'+starStr+'</span>';
      (function(mid,gln,lock){
        lvl.onclick=function(){
          if(lock){toast("先通关全局第 "+gln+" 课时来解锁");return}
          state.currentModule=mid; state.currentLevel=gln; state._lastModule=mid; saveState(); showStory();
        };
      })(mod.id,gl,locked);
      block.appendChild(lvl);
    }
    m.appendChild(block);
  });
}

function showStory(){
  var s=state.currentModule==="A"?STORY_A:(state.currentModule==="B"?STORY_B:STORY_C);
  var ch=chapterOfLesson(state.currentLevel), ln=lessonInChapterOf(state.currentLevel);
  document.getElementById("story-title").textContent="第"+ch+"章 · 第"+ln+"课时 · "+(state.currentModule==="A"?"选词填空":state.currentModule==="B"?"拼写补全":"释义匹配");
  document.getElementById("story-text").innerHTML=(s[Math.min(state.currentLevel,7)]||"冒险继续...")+"<br><i>"+CHAPTERS[ch-1]+"</i>";
  switchPage("story");
}

function startQuiz(){
  state.hp=3; state.score=0; state.currentQ=0; state.reviewList=[];
  var lessonWords=getLessonWords(state.currentLevel);
  var unmastered=lessonWords.filter(function(w){return !state.mastery[w.word]});
  state.quizWords=(unmastered.length>0?unmastered:lessonWords).slice(0,WORDS_PER_LESSON);
  switchPage("quiz"); renderQuiz();
}

function renderQuiz(){
  if(state.currentQ>=state.quizWords.length){showResult();return}
  var q=state.quizWords[state.currentQ];
  var modTxt=state.currentModule==="A"?"选词填空":state.currentModule==="B"?"拼写补全":"释义匹配";
  var ch=chapterOfLesson(state.currentLevel), ln=lessonInChapterOf(state.currentLevel);
  document.getElementById("quiz-header").innerHTML="第"+ch+"章 · 第"+ln+"课时 · "+modTxt+" ("+(state.currentQ+1)+"/"+state.quizWords.length+") <span style='float:right'>♥"+state.hp+"</span>";
  var c=document.getElementById("quiz-area"); c.innerHTML="";
  if(state.currentModule==="A")renderA(q,c);
  else if(state.currentModule==="B")renderB(q,c);
  else renderC(q,c);
}

function renderA(q,c){
  var sent=q.sentence.replace("______",'<span class="blank">?</span>');
  c.innerHTML='<div style="text-align:center;margin-bottom:10px;font-size:14px">'+q.art+' <i>'+CHAPTERS[(q.ch||1)-1]+'</i></div>'
    +'<div class="sentence-blank">'+sent+'</div>'
    +'<div style="font-size:13px;color:#888;margin-bottom:8px">'+q.translation+'</div>'
    +'<button onclick="speak(\''+q.word+'\')" style="padding:6px 12px;background:var(--purple);color:#fff;border:none;border-radius:8px;cursor:pointer;margin-bottom:8px">🔊 听发音</button>'
    +'<div class="options" id="opts"></div>';
  var opts=[q.word];
  while(opts.length<4){var r=WORDS[Math.floor(Math.random()*WORDS.length)].word; if(opts.indexOf(r)===-1)opts.push(r)}
  opts.sort(function(){return Math.random()-0.5});
  var oc=document.getElementById("opts");
  opts.forEach(function(o){
    var d=document.createElement("div"); d.className="opt"; d.textContent=o;
    d.onclick=function(){
      if(this.classList.contains("correct"))return;
      if(o===q.word){
        this.classList.add("correct");
        state.score++; state.coins+=10; state.mastery[q.word]=true; state.wordStatus[q.word]="mastered";
        var ri=state.reviewList.indexOf(q.word); if(ri>-1)state.reviewList.splice(ri,1);
        saveState(); setTimeout(function(){state.currentQ++;renderQuiz()},700);
      }else{
        this.classList.add("wrong");
        state.hp--; if(state.reviewList.indexOf(q.word)===-1)state.reviewList.push(q.word); state.wordStatus[q.word]="review";
        saveState(); if(state.hp<=0)setTimeout(showResult,800);
      }
    };
    oc.appendChild(d);
  });
}

function renderB(q,c){
  var prefix=q.word.substring(0,Math.ceil(q.word.length/2));
  var remaining=q.word.substring(prefix.length).split("");
  var letters=remaining.slice();
  var extra=["a","e","i","o","u","s","t","n","r","p","l","k","d","m","b","x","y","z","c","g"];
  while(letters.length<Math.max(remaining.length+2,4)){var r=extra[Math.floor(Math.random()*extra.length)]; if(letters.indexOf(r)===-1)letters.push(r)}
  letters.sort(function(){return Math.random()-0.5});
  var html='<div style="text-align:center">补全拼写：</div><div style="text-align:center;margin:10px 0"><span class="spell-prefix">'+prefix+'</span>';
  for(var i=0;i<remaining.length;i++)html+='<span class="spell-box" id="sb'+i+'"></span>';
  html+='</div><div style="text-align:center;color:#888;font-size:13px">'+q.meaning+' '+q.art+'</div><div class="letter-pool" style="text-align:center;margin-top:8px" id="lp">';
  letters.forEach(function(l){html+='<span class="letter-btn" data-l="'+l+'">'+l+'</span>'});
  html+='</div><button onclick="speak(\''+q.word+'\')" style="margin-top:8px;padding:6px 12px;background:var(--purple);color:#fff;border:none;border-radius:8px;cursor:pointer">🔊 听发音</button>';
  c.innerHTML=html;
  var filled=0, corrLen=remaining.length;
  c.querySelectorAll(".letter-btn").forEach(function(btn){
    btn.onclick=function(){
      if(this.classList.contains("used"))return;
      var sb=document.getElementById("sb"+filled); if(!sb)return;
      var l=this.dataset.l; sb.textContent=l; this.classList.add("used");
      if(l===remaining[filled]){
        sb.classList.add("filled"); filled++;
        if(filled===corrLen){
          state.score++; state.coins+=10; state.mastery[q.word]=true; state.wordStatus[q.word]="mastered";
          var ri=state.reviewList.indexOf(q.word); if(ri>-1)state.reviewList.splice(ri,1);
          saveState(); setTimeout(function(){state.currentQ++;renderQuiz()},800);
        }
      }else{
        sb.classList.add("wrong"); state.hp--;
        if(state.reviewList.indexOf(q.word)===-1)state.reviewList.push(q.word); state.wordStatus[q.word]="review";
        saveState(); if(state.hp<=0)setTimeout(showResult,800);
      }
    };
  });
}

function renderC(q,c){
  c.innerHTML='<div style="text-align:center;font-size:22px;font-weight:bold;color:var(--purple)">'+q.word+'</div>'
    +'<div style="text-align:center;color:#888">'+q.phon+' '+q.pos+'</div>'
    +'<button onclick="speak(\''+q.word+'\')" style="display:block;margin:8px auto;padding:6px 12px;background:var(--purple);color:#fff;border:none;border-radius:8px;cursor:pointer">🔊 发音</button>'
    +'<div style="margin:10px 0;text-align:center">选择正确释义：</div><div class="options" id="opts"></div>';
  var opts=[q.meaning];
  var others=WORDS.filter(function(w){return w.meaning!==q.meaning}).map(function(w){return w.meaning});
  while(opts.length<4){var r=others[Math.floor(Math.random()*others.length)]; if(opts.indexOf(r)===-1)opts.push(r)}
  opts.sort(function(){return Math.random()-0.5});
  var oc=document.getElementById("opts");
  opts.forEach(function(o){
    var d=document.createElement("div"); d.className="opt"; d.textContent=o;
    d.onclick=function(){
      if(o===q.meaning){
        this.classList.add("correct");
        state.score++; state.coins+=10; state.mastery[q.word]=true; state.wordStatus[q.word]="mastered";
        var ri=state.reviewList.indexOf(q.word); if(ri>-1)state.reviewList.splice(ri,1);
        saveState(); setTimeout(function(){state.currentQ++;renderQuiz()},700);
      }else{
        this.classList.add("wrong");
        state.hp--; if(state.reviewList.indexOf(q.word)===-1)state.reviewList.push(q.word); state.wordStatus[q.word]="review";
        saveState(); if(state.hp<=0)setTimeout(showResult,800);
      }
    };
    oc.appendChild(d);
  });
}

function showResult(){
  var stars=state.score===10?3:(state.score>=7?2:(state.score>=5?1:0));
  var key=state.currentModule+"_"+state.currentLevel;
  var old=state.cleared[key]||0; state.cleared[key]=Math.max(old,stars);
  if(stars>0){
    var newP=Math.max(state.lessonProgress,state.currentLevel+1);
    if(newP>state.lessonProgress){state.lessonProgress=newP; toast("🎉 所有板块已解锁第 "+newP+" 课时！")}
  }
  saveState();
  document.getElementById("result-stars").textContent="★".repeat(stars)+"☆".repeat(3-stars);
  document.getElementById("result-title").textContent=stars>0?"课时通关！":"再试一次";
  document.getElementById("result-desc").textContent="得分："+state.score+"/10 · 金币：🪙"+state.coins+" · 剩余♥"+state.hp;
  switchPage("result");
}
function backToMap(){switchPage("map")}
function retryLevel(){startQuiz()}

function showDetail(q){
  document.getElementById("modal-word").textContent=q.word;
  document.getElementById("modal-phon").textContent=q.phon;
  document.getElementById("modal-pos").textContent=q.pos;
  document.getElementById("modal-meaning").textContent=q.meaning;
  document.getElementById("modal-art").textContent=q.art;
  document.getElementById("modal-example").textContent=q.sentence.replace("______","【"+q.word+"】");
  document.getElementById("word-modal").classList.add("active");
  window._curWord=q.word;
}
function closeModal(){document.getElementById("word-modal").classList.remove("active")}
function playModalWord(){if(window._curWord)speak(window._curWord)}
function speak(t){if('speechSynthesis' in window){var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.8;speechSynthesis.speak(u)}}

function renderWordList(f){
  var list=document.getElementById("word-list"); list.innerHTML="";
  WORDS.forEach(function(w){
    var s=state.mastery[w.word]?"mastered":(state.reviewList.indexOf(w.word)>-1?"review":"learning");
    if(f!=="all"&&f!==s)return;
    var d=document.createElement("div"); d.style="padding:10px;border-bottom:1px dashed #ccc;display:flex;justify-content:space-between;align-items:center";
    d.innerHTML='<div><b>'+w.word+'</b> <span style="color:#888;font-size:12px">'+w.phon+'</span><br><span style="font-size:13px;color:#555">'+w.meaning+'</span></div><span style="font-size:18px">'+w.art+'</span>';
    list.appendChild(d);
  });
}
function filterWords(f,btn){
  btn.parentNode.querySelectorAll(".opt").forEach(function(b){b.classList.remove("active")});
  btn.classList.add("active"); renderWordList(f);
}
function renderMe(){
  var m=0; for(var k in state.mastery)if(state.mastery[k])m++;
  document.getElementById("me-mastered").textContent=m;
  document.getElementById("me-total").textContent=WORDS.length;
  document.getElementById("me-coins").textContent=state.coins;
  document.getElementById("me-lesson").textContent=state.lessonProgress;
  var rl=document.getElementById("review-list");
  if(state.reviewList.length===0)rl.innerHTML='<p style="color:#888;font-size:13px">暂无需复习单词 🎉</p>';
  else rl.innerHTML=state.reviewList.map(function(w){return'<span style="display:inline-block;background:#f8d7da;padding:4px 10px;border-radius:8px;margin:3px;font-size:13px">'+w+'</span>'}).join("");
}

var audioCtx=null,bgmTimer=null,musicOn=false;
document.getElementById("musicBtn").onclick=function(){
  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  if(musicOn){clearInterval(bgmTimer);this.textContent="🎵";this.classList.remove("playing");musicOn=false}
  else{this.textContent="🎶";this.classList.add("playing");musicOn=true;playNote(523,.3);bgmTimer=setInterval(function(){playNote([523,659,784,659,587][Math.floor(Math.random()*5)],.4)},750)}
};
function playNote(freq,dur){if(!audioCtx)return;try{var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;g.gain.value=.02;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur)}catch(e){}}

document.addEventListener("DOMContentLoaded",function(){loadState();renderMap()});
</script>
